# Quality Prop automates bugs & feature requests into code changes.
# This config controls Quality Prop behavior.

# This setting contains a list of rules that Quality Prop will check for. If any of these rules are broken in a new commit, Quality Prop will create a pull request to fix the broken rule.
rules:
  - "All new business logic should have corresponding unit tests."
  - "Refactor large functions to be more modular."
  - "Add docstrings to all functions and file headers."

# This is the branch that Quality Prop will develop from and make pull requests to. Most people use 'main' or 'master' but some users also use 'dev' or 'staging'.
branch: 'main'

# By default Quality Prop will read the logs and outputs from your existing Github Actions. To disable this, set this to false.
gha_enabled: True

# This is the description of your project. It will be used by Quality Prop when creating PRs. You can tell Quality Prop what's unique about your project, what frameworks you use, or anything else you want.
#
# Example:
#
# description: quality_prop/quality_prop is a python project. The main api endpoints are in quality_prop/api.py. Write code that adheres to PEP8.
description: ''

# This sets whether to create pull requests as drafts. If this is set to True, then all pull requests will be created as drafts and GitHub Actions will not be triggered.
draft: False

# This is a list of directories that Quality Prop will not be able to edit.
blocked_dirs: []
